server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: mrelote
  datasource:
    url: ${MRELOTE_SUPABASE_DB_HOST}
    username: ${MRELOTE_SUPABASE_DB_USER}
    password: ${MRELOTE_SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${MRELOTE_SUPABASE_JWKS_URI}
          issuer-uri: ${MRELOTE_SUPABASE_ISSUER}
          jws-algorithms: ${MRELOTE_SUPABASE_JWS_ALG:ES256}

app:
  supabase:
    url: ${MRELOTE_SUPABASE_URL}
    service-role-key: ${MRELOTE_SUPABASE_SERVICE_ROLE_KEY}
    anon-key: ${MRELOTE_SUPABASE_ANON_KEY}
  auth:
    cookie:
      access-name: ${MRELOTE_ACCESS_COOKIE_NAME:mre_access}
      refresh-name: ${MRELOTE_REFRESH_COOKIE_NAME:mre_refresh}
      domain: ${MRELOTE_COOKIE_DOMAIN:}
      secure: ${MRELOTE_COOKIE_SECURE:false}
      same-site: ${MRELOTE_COOKIE_SAME_SITE:Strict}
    cors:
      allowed-origins: ${MRELOTE_ALLOWED_ORIGINS:http://localhost:8081}
  carrito:
    tarifa-envio: 3000
  admin:
    nombre: ${MRELOTE_ADMIN_NOMBRE:Administrador}
    telefono: ${MRELOTE_ADMIN_TELEFONO:"0000000000"}
    correo: ${MRELOTE_ADMIN_CORREO:admin@mrelote.com}
    password: ${MRELOTE_ADMIN_PASSWORD:Admin1234!}
    direccion: ${MRELOTE_ADMIN_DIRECCION:MrElote HQ}
