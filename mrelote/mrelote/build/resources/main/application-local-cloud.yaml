# Spring profile: local-cloud
#
# Backend corriendo en tu máquina, conectado a un proyecto Supabase real
# (no localhost / no docker-compose / no Supabase self-hosted).
#
# Activación: exporta SPRING_PROFILES_ACTIVE=local-cloud antes de arrancar
# (en tu shell, IDE run config o .env cargado por tu IDE).
#
# Pre-requisitos en .env (todos siguen los mismos nombres que application.yaml):
#   - MRELOTE_SUPABASE_URL              = https://<ref>.supabase.co
#   - MRELOTE_SUPABASE_ANON_KEY         = <anon_key>
#   - MRELOTE_SUPABASE_SERVICE_ROLE_KEY = <service_role_key>
#   - MRELOTE_SUPABASE_JWKS_URI         = https://<ref>.supabase.co/auth/v1/.well-known/jwks.json
#   - MRELOTE_SUPABASE_ISSUER           = https://<ref>.supabase.co/auth/v1
#   - MRELOTE_SUPABASE_DB_HOST          = jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require  (Session Pooler, JDBC URL completo)
#   - MRELOTE_SUPABASE_DB_USER          = mrelote_app.<ref>                    (ver caveat DEPLOY.md §1.5)
#   - MRELOTE_SUPABASE_DB_PASSWORD      = <password del usuario Postgres>
#   - MRELOTE_ADMIN_*                   = seed del admin local
#
# Cookies y CORS quedan en valores aptos para HTTP localhost.
# Para depurar JWT/cookies/Admin API se activa logging DEBUG en auth + Supabase client.

app:
  auth:
    cookie:
      secure: false
    cors:
      allowed-origins: http://localhost:8081

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.web: DEBUG
    com.grupocinco.mrelote.auth: DEBUG
    com.grupocinco.mrelote.auth.supabase: DEBUG
