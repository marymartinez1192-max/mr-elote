services:
  postgres:
    image: postgres:17
    container_name: mrelote-db
    environment:
      POSTGRES_DB: mrelote
      POSTGRES_USER: mrelote
      POSTGRES_PASSWORD: mrelote
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrelote -d mrelote"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
