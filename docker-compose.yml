services:
  postgres:
    image: postgres:17-alpine
    container_name: mrelote-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mrelote}
      POSTGRES_USER: ${POSTGRES_USER:-mrelote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrelote}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mrelote} -d ${POSTGRES_DB:-mrelote}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mrelote-net

  backend:
    build:
      context: ./mrelote/mrelote
      dockerfile: Dockerfile
    image: mrelote-backend:latest
    container_name: mrelote-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mrelote}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mrelote}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mrelote}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_JWT_SECRET: ${APP_JWT_SECRET:-bXJlbG90ZTIwMjRzZWNyZXRrZXlmb3Jqd3R0b2tlbjMyYnl0ZXMh}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-86400000}
      APP_ADMIN_NOMBRE: ${APP_ADMIN_NOMBRE:-Administrador}
      APP_ADMIN_TELEFONO: ${APP_ADMIN_TELEFONO:-0000000000}
      APP_ADMIN_CORREO: ${APP_ADMIN_CORREO:-admin@mrelote.com}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin1234}
      APP_ADMIN_DIRECCION: ${APP_ADMIN_DIRECCION:-MrElote HQ}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - mrelote-net

  frontend:
    build:
      context: ./mrelote-front
      dockerfile: Dockerfile
    image: mrelote-frontend:latest
    container_name: mrelote-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # /api/v1 is proxied by nginx to the backend service.
      # Override only if exposing the backend on a different host/port.
      API_BASE_URL: ${API_BASE_URL:-/api/v1}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - mrelote-net

volumes:
  postgres_data:

networks:
  mrelote-net:
    driver: bridge
