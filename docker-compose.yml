services:
  backend:
    build:
      context: ./mrelote/mrelote
      dockerfile: Dockerfile
    image: mrelote-backend:latest
    container_name: mrelote-backend
    restart: unless-stopped
    environment:
      # Supabase
      MRELOTE_SUPABASE_URL: ${MRELOTE_SUPABASE_URL}
      MRELOTE_SUPABASE_ANON_KEY: ${MRELOTE_SUPABASE_ANON_KEY}
      MRELOTE_SUPABASE_SERVICE_ROLE_KEY: ${MRELOTE_SUPABASE_SERVICE_ROLE_KEY}
      MRELOTE_SUPABASE_JWKS_URI: ${MRELOTE_SUPABASE_JWKS_URI}
      MRELOTE_SUPABASE_ISSUER: ${MRELOTE_SUPABASE_ISSUER}
      MRELOTE_SUPABASE_JWS_ALG: ${MRELOTE_SUPABASE_JWS_ALG:-ES256}
      # Postgres on Supabase (full JDBC URL en MRELOTE_SUPABASE_DB_HOST)
      MRELOTE_SUPABASE_DB_HOST: ${MRELOTE_SUPABASE_DB_HOST}
      MRELOTE_SUPABASE_DB_USER: ${MRELOTE_SUPABASE_DB_USER}
      MRELOTE_SUPABASE_DB_PASSWORD: ${MRELOTE_SUPABASE_DB_PASSWORD}
      # Cookies
      MRELOTE_ACCESS_COOKIE_NAME: ${MRELOTE_ACCESS_COOKIE_NAME:-mre_access}
      MRELOTE_REFRESH_COOKIE_NAME: ${MRELOTE_REFRESH_COOKIE_NAME:-mre_refresh}
      MRELOTE_COOKIE_DOMAIN: ${MRELOTE_COOKIE_DOMAIN:-}
      MRELOTE_COOKIE_SECURE: ${MRELOTE_COOKIE_SECURE:-false}
      MRELOTE_COOKIE_SAME_SITE: ${MRELOTE_COOKIE_SAME_SITE:-Strict}
      # CORS
      MRELOTE_ALLOWED_ORIGINS: ${MRELOTE_ALLOWED_ORIGINS:-http://localhost:8081}
      # Admin seed
      MRELOTE_ADMIN_NOMBRE: ${MRELOTE_ADMIN_NOMBRE:-Administrador}
      MRELOTE_ADMIN_TELEFONO: ${MRELOTE_ADMIN_TELEFONO:-0000000000}
      MRELOTE_ADMIN_CORREO: ${MRELOTE_ADMIN_CORREO:-admin@mrelote.com}
      MRELOTE_ADMIN_PASSWORD: ${MRELOTE_ADMIN_PASSWORD:-Admin1234!}
      MRELOTE_ADMIN_DIRECCION: ${MRELOTE_ADMIN_DIRECCION:-MrElote HQ}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    ports:
      - "${MRELOTE_BACKEND_PORT:-8080}:8080"
    networks:
      - mrelote-net

  frontend:
    build:
      context: ./mrelote-front
      dockerfile: Dockerfile
    image: mrelote-frontend:latest
    container_name: mrelote-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: ${MRELOTE_API_BASE_URL:-/api/v1}
    ports:
      - "${MRELOTE_FRONTEND_PORT:-8081}:80"
    networks:
      - mrelote-net

networks:
  mrelote-net:
    driver: bridge
